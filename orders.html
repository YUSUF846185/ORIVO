<!DOCTYPE html>
<html lang="tg">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ORIVO | Фармоишҳо</title>

    <link rel="stylesheet"
          href="style.css">
    <script src="authGuard.js"></script>
    <script src="orivoStore.js"></script>

    <style>

        /* =========================================
           ORDERS PAGE
        ========================================= */

        .orders-page {
            width: 92%;
            max-width: 1200px;
            margin: 40px auto 80px;
        }


        /* =========================================
           HERO
        ========================================= */

        .orders-hero {
            background:
                linear-gradient(
                    135deg,
                    #063d2c,
                    #08764d
                );

            color: white;
            padding: 45px 25px;
            border-radius: 28px;
            text-align: center;
            margin-bottom: 30px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, .10);
        }


        .orders-hero-icon {
            font-size: 55px;
            margin-bottom: 10px;
        }


        .orders-hero h1 {
            margin: 0 0 10px;
            font-size: 42px;
        }


        .orders-hero p {
            margin: 0;
            opacity: .85;
            font-size: 15px;
        }


        /* =========================================
           TOP BAR
        ========================================= */

        .orders-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }


        .orders-count {
            font-size: 15px;
            font-weight: 800;
            color: #64736c;
        }


        .clear-orders-button {
            border: none;
            background: #fff0f2;
            color: #c0394f;
            padding: 11px 17px;
            border-radius: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: .25s;
        }


        .clear-orders-button:hover {
            background: #ffdce2;
            transform: translateY(-1px);
        }


        /* =========================================
           ORDERS LIST
        ========================================= */

        #ordersList {
            display: grid;
            gap: 20px;
        }


        /* =========================================
           ORDER CARD
        ========================================= */

        .order-card {
            background: white;
            border: 1px solid #e2ebe6;
            border-radius: 22px;
            padding: 24px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, .05);

            transition: .25s;
        }


        .order-card:hover {
            transform: translateY(-2px);

            box-shadow:
                0 15px 40px rgba(0, 0, 0, .08);
        }


        /* =========================================
           ORDER HEADER
        ========================================= */

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;

            padding-bottom: 18px;
            margin-bottom: 18px;

            border-bottom: 1px solid #edf1ef;
        }


        .order-number {
            color: #08764d;
            font-size: 17px;
            font-weight: 900;
        }


        .order-date {
            margin-top: 6px;
            color: #7b8982;
            font-size: 13px;
        }


        .order-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            padding: 8px 13px;

            border-radius: 30px;

            background: #eaf8f1;
            color: #08764d;

            font-size: 13px;
            font-weight: 900;
        }


        /* =========================================
           CUSTOMER
        ========================================= */

        .order-customer {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;
            margin-bottom: 22px;
        }


        .customer-box {
            background: #f8faf9;
            border-radius: 13px;
            padding: 13px;
        }


        .customer-box small {
            display: block;

            color: #7b8982;

            font-size: 11px;
            font-weight: 800;

            margin-bottom: 6px;
        }


        .customer-box strong {
            display: block;

            color: #26352e;

            font-size: 14px;

            word-break: break-word;
        }


        /* =========================================
           PRODUCTS TITLE
        ========================================= */

        .order-products-title {
            margin-bottom: 12px;

            font-size: 16px;
            font-weight: 900;
        }


        /* =========================================
           PRODUCTS
        ========================================= */

        .order-products {
            display: grid;
            gap: 10px;
        }


        .order-product {
            display: flex;
            align-items: center;
            gap: 13px;

            padding: 11px;

            background: #fafcfb;

            border: 1px solid #e8eeeb;

            border-radius: 13px;
        }


        .order-product img {
            width: 58px;
            height: 58px;

            object-fit: contain;

            background: white;

            border-radius: 10px;

            padding: 5px;

            flex-shrink: 0;
        }


        .order-product-info {
            flex: 1;
        }


        .order-product-info h4 {
            margin: 0 0 5px;

            font-size: 14px;
        }


        .order-product-info p {
            margin: 0;

            color: #7b8982;

            font-size: 12px;
        }


        .order-product-price {
            color: #08764d;

            font-size: 14px;

            font-weight: 900;

            white-space: nowrap;
        }


        /* =========================================
           ORDER FOOTER
        ========================================= */

        .order-footer {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 20px;

            margin-top: 20px;
            padding-top: 18px;

            border-top: 1px solid #edf1ef;
        }


        .payment-method {
            color: #68766f;
            font-size: 13px;
        }


        .payment-method strong {
            color: #26352e;
        }


        .order-total {
            text-align: right;
        }


        .order-total span {
            display: block;

            color: #7b8982;

            font-size: 12px;

            margin-bottom: 4px;
        }


        .order-total strong {
            color: #08764d;
            font-size: 23px;
        }


        /* =========================================
           DELETE BUTTON
        ========================================= */

        .delete-order-button {
            margin-top: 16px;

            border: none;

            background: transparent;

            color: #c0394f;

            font-size: 13px;

            font-weight: 800;

            cursor: pointer;

            padding: 5px 0;
        }


        .delete-order-button:hover {
            text-decoration: underline;
        }


        /* =========================================
           EMPTY
        ========================================= */

        .orders-empty {
            background: white;

            border: 1px solid #e2ebe6;

            border-radius: 22px;

            padding: 70px 25px;

            text-align: center;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, .05);
        }


        .orders-empty-icon {
            font-size: 65px;
            margin-bottom: 15px;
        }


        .orders-empty h2 {
            margin: 0 0 10px;
        }


        .orders-empty p {
            color: #78857f;
            margin-bottom: 22px;
        }


        .shop-button {
            display: inline-flex;

            padding: 13px 22px;

            border-radius: 12px;

            background: #08764d;

            color: white;

            text-decoration: none;

            font-weight: 900;

            transition: .25s;
        }


        .shop-button:hover {
            background: #E85D00;

            transform: translateY(-2px);
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 850px) {

            .order-customer {
                grid-template-columns: 1fr 1fr;
            }

        }


        @media (max-width: 600px) {

            .orders-page {
                width: 94%;
                margin-top: 25px;
            }


            .orders-hero {
                padding: 35px 20px;
            }


            .orders-hero h1 {
                font-size: 30px;
            }


            .orders-topbar {
                flex-direction: column;
                align-items: stretch;
            }


            .clear-orders-button {
                width: 100%;
            }


            .order-card {
                padding: 18px;
            }


            .order-header {
                flex-direction: column;
                align-items: flex-start;
            }


            .order-customer {
                grid-template-columns: 1fr;
            }


            .order-product {
                flex-wrap: wrap;
            }


            .order-product-price {
                width: 100%;
                padding-left: 71px;
            }


            .order-footer {
                flex-direction: column;
                align-items: flex-start;
            }


            .order-total {
                text-align: left;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>


    <!-- LOGO -->

    <a
        href="index.html"
        class="brand"
    >

        <img
            src="images/orivo-logo.png"
            alt="ORIVO"
            class="brand-logo"
        >


        <div class="brand-info">

            <div class="brand-name">
                ORIVO
            </div>


            <div class="brand-subtitle">
                TAJIKISTAN MARKETPLACE
            </div>

        </div>

    </a>



    <!-- SEARCH -->

    <div class="search-box">

        <input
            id="orderSearch"
            type="text"
            placeholder="🔍 Ҷустуҷӯи фармоиш..."
        >

    </div>



    <!-- MENU -->

    <div class="menu">


        <a
            href="index.html"
            class="header-link"
            title="Home"
        >
            🏠
        </a>


        <a
            href="wishlist.html"
            class="header-link"
            title="Wishlist"
        >

            ❤️

            <span id="wishlistCount">
                0
            </span>

        </a>


        <a
            href="index.html#cart"
            class="header-link"
            title="Cart"
        >

            🛒

            <span id="cartCount">
                0
            </span>

        </a>


        <button
            id="themeButton"
            class="theme-button"
            type="button"
            title="Theme"
        >

            🌙

        </button>

    </div>

</header>



<!-- =========================================
     MAIN
========================================= -->

<main class="orders-page">


    <!-- HERO -->

    <section class="orders-hero">

        <div class="orders-hero-icon">
            🧾
        </div>


        <h1>
            Фармоишҳои ман
        </h1>


        <p>
            Ҳамаи фармоишҳои шумо
            дар як ҷо.
        </p>

    </section>



    <!-- TOP BAR -->

    <div class="orders-topbar">


        <div
            id="ordersCount"
            class="orders-count"
        >

            Фармоишҳо: 0

        </div>


        <button
            id="clearOrdersButton"
            class="clear-orders-button"
            type="button"
        >

            🗑️ Тоза кардани ҳама

        </button>

    </div>



    <!-- ORDERS -->

    <section id="ordersList">

        <!--
            orders.js фармоишҳоро
            дар ин ҷо нишон медиҳад.
        -->

    </section>


</main>



<!-- =========================================
     FOOTER
========================================= -->

<footer>


    <div class="footer-brand">


        <img
            src="images/orivo-logo.png"
            alt="ORIVO"
        >


        <div>

            <h3>
                ORIVO
            </h3>


            <p>
                TAJIKISTAN MARKETPLACE
            </p>

        </div>


    </div>


    <p>
        © 2026 ORIVO Marketplace
    </p>


</footer>



<!-- =========================================
     ORDERS JAVASCRIPT
========================================= -->

<script src="i18n.js"></script>
<script src="orders.js"></script>


</body>

</html>
